<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="60%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
  </defs>

  <!-- Top suspension handle -->
  <path d="M50 14 Q60 8 70 14" fill="none" stroke="#ffd54f" stroke-width="2.5"/>
  <rect x="46" y="16" width="28" height="6" rx="2" fill="#212121" stroke="#ffd54f" stroke-width="1.5"/>

  <!-- Red Lantern Oval Body -->
  <ellipse cx="60" cy="58" rx="36" ry="38" fill="url(#lanternGlow)" stroke="#ffd700" stroke-width="2"/>

  <!-- Ribs / Lines -->
  <path d="M38 32 Q60 36 82 32" fill="none" stroke="#b71c1c" stroke-width="1.5"/>
  <path d="M30 58 Q60 62 90 58" fill="none" stroke="#b71c1c" stroke-width="1.5"/>
  <path d="M38 84 Q60 88 82 84" fill="none" stroke="#b71c1c" stroke-width="1.5"/>

  <!-- Center Kanji: 祭 (Festival) -->
  <circle cx="60" cy="58" r="16" fill="#fffde7" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="60" y="64" font-size="16" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#d50000" text-anchor="middle">祭</text>

  <!-- Bottom Cap & Golden Tassel -->
  <rect x="48" y="94" width="24" height="6" rx="2" fill="#212121" stroke="#ffd54f" stroke-width="1.5"/>
  <path d="M56 100 L53 114 M60 100 L60 116 M64 100 L67 114" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>
</svg>