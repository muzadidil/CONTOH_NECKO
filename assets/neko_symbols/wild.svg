<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="wildBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="35%" stop-color="#ffb300"/>
      <stop offset="70%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <filter id="wShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Golden Fan Rays -->
  <circle cx="60" cy="60" r="52" fill="url(#wildBg)" stroke="#fff8e1" stroke-width="3" filter="url(#wShadow)"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Golden Ornaments -->
  <path d="M60 14 L64 26 L76 26 L66 33 L70 45 L60 38 L50 45 L54 33 L44 26 L56 26 Z" fill="#fff" opacity="0.8"/>
  <circle cx="60" cy="60" r="32" fill="#211006" stroke="#ffd54f" stroke-width="2"/>

  <!-- WILD Text -->
  <g transform="translate(60, 60)">
    <rect x="-38" y="-12" width="76" height="24" rx="6" fill="url(#ribbon)" stroke="#ffe082" stroke-width="2"/>
    <text x="0" y="6" font-size="16" font-family="'Arial Black', Impact, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">WILD</text>
  </g>
  <text x="60" y="86" font-size="10" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#ffe082" text-anchor="middle" letter-spacing="2">百搭</text>
</svg>