<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="brocade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00acc1"/>
      <stop offset="50%" stop-color="#00838f"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>

  <!-- Golden String Loop -->
  <path d="M60 16 Q60 30 52 38 M60 16 Q60 30 68 38" fill="none" stroke="#ffd700" stroke-width="2.5"/>
