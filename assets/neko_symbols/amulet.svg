  <text x="60" y="69" font-size="10" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#b71c1c" text-anchor="middle">開</text>
  <text x="60" y="81" font-size="10" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#b71c1c" text-anchor="middle">運</text>
