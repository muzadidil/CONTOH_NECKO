<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="catGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffd54f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="40%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="redCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="50%" stop-color="#f44336"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#catGlow)"/>

  <!-- Body -->
  <g filter="url(#shadow)">
    <path d="M36 68 C36 50 84 50 84 68 C84 94 80 106 60 106 C40 106 36 94 36 68 Z" fill="url(#goldFur)" stroke="#d7ccc8" stroke-width="2"/>
    
    <!-- Ears -->
    <path d="M38 46 L26 22 C34 20 46 28 48 38 Z" fill="url(#goldFur)" stroke="#d7ccc8" stroke-width="1.5"/>
    <path d="M36 42 L29 25 C34 24 43 30 44 37 Z" fill="#ff8a80"/>
    <path d="M82 46 L94 22 C86 20 74 28 72 38 Z" fill="url(#goldFur)" stroke="#d7ccc8" stroke-width="1.5"/>
    <path d="M84 42 L91 25 C86 24 77 30 76 37 Z" fill="#ff8a80"/>

    <!-- Head -->
    <ellipse cx="60" cy="50" rx="28" ry="24" fill="url(#goldFur)" stroke="#d7ccc8" stroke-width="2"/>

    <!-- Calico Spots -->
    <path d="M42 30 C46 38 40 44 34 40 C32 35 36 30 42 30 Z" fill="#3e2723"/>
    <path d="M82 34 C80 42 86 44 88 40 C88 35 84 32 82 34 Z" fill="#ff8f00"/>

    <!-- Eyes (Happy Arcs) -->
    <path d="M44 48 C47 43 53 43 56 48" fill="none" stroke="#212121" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M64 48 C67 43 73 43 76 48" fill="none" stroke="#212121" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Nose & Mouth -->
    <polygon points="60,53 58,56 62,56" fill="#ff5252"/>
    <path d="M60 56 Q56 61 52 58 M60 56 Q64 61 68 58" fill="none" stroke="#3e2723" stroke-width="2" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="32" y1="52" x2="42" y2="53" stroke="#8d6e63" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="30" y1="58" x2="42" y2="57" stroke="#8d6e63" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="88" y1="52" x2="78" y2="53" stroke="#8d6e63" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="90" y1="58" x2="78" y2="57" stroke="#8d6e63" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Red Collar with Golden Bell -->
    <path d="M40 68 Q60 76 80 68 Q60 72 40 68 Z" fill="url(#redCollar)"/>
    <circle cx="60" cy="73" r="5.5" fill="#ffd700" stroke="#b8860b" stroke-width="1.2"/>
    <circle cx="60" cy="73" r="1.5" fill="#5d4037"/>

    <!-- Right Raised Paw (Beckoning) -->
    <ellipse cx="82" cy="48" rx="8" ry="12" fill="url(#goldFur)" stroke="#d7ccc8" stroke-width="2" transform="rotate(-25 82 48)"/>
    <ellipse cx="84" cy="42" rx="4.5" ry="3.5" fill="#ffab91"/>

    <!-- Golden Koban (Coin with 10 Million Ryo Kanji) -->
    <ellipse cx="60" cy="90" rx="14" ry="18" fill="url(#goldCoin)" stroke="#ffe082" stroke-width="1.8"/>
    <ellipse cx="60" cy="90" rx="11" ry="15" fill="none" stroke="#ff6f00" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="60" y="87" font-size="9" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#bf360c" text-anchor="middle">千萬</text>
    <text x="60" y="97" font-size="9" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#bf360c" text-anchor="middle">兩</text>

    <!-- +2 Multiplier Badge Floating on Top -->
    <g transform="translate(60, 16)">
      <rect x="-24" y="-10" width="48" height="20" rx="10" fill="#d32f2f" stroke="#ffe082" stroke-width="1.5"/>
      <text x="0" y="4" font-size="12" font-family="'Arial Black', sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">X2</text>
    </g>
  </g>
</svg>