<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="darumaRed" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#7f0000"/>
    </radialGradient>
    <linearGradient id="goldDeco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
  </defs>

  <!-- Rounded Bodhidharma Body -->
  <ellipse cx="60" cy="62" rx="44" ry="46" fill="url(#darumaRed)" stroke="#ffcdd2" stroke-width="2.5"/>

  <!-- Face Plate -->
  <ellipse cx="60" cy="50" rx="26" ry="22" fill="#fff9c4" stroke="#d7ccc8" stroke-width="1.5"/>

  <!-- Eyebrows (Crane shape) -->
  <path d="M40 38 Q46 34 52 40" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 38 Q74 34 68 40" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes with Black Pupils (Wide open & determined) -->
  <circle cx="47" cy="47" r="7" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <circle cx="47" cy="47" r="4.2" fill="#212121"/>
  <circle cx="73" cy="47" r="7" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <circle cx="73" cy="47" r="4.2" fill="#212121"/>

  <!-- Mustache (Tortoise shape) -->
  <path d="M42 60 Q50 56 60 62 Q70 56 78 60" fill="none" stroke="#212121" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Gold Kanji on Chest: 必勝 (Certain Victory) -->
  <circle cx="60" cy="85" r="14" fill="none" stroke="url(#goldDeco)" stroke-width="2"/>
  <text x="60" y="89" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="900" fill="url(#goldDeco)" text-anchor="middle">勝</text>
</svg>